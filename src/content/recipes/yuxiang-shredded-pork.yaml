steps:
  - text: 青椒、胡萝卜、泡发木耳和熟笋切丝，姜、蒜、泡红椒切末，葱切成葱花。另用干净的菜板将里脊肉切丝。
    uses: [green-pepper, carrot, wood-ear, bamboo-shoot, ginger, garlic, pickled-chili, scallion, pork]
  - text: 肉丝加入料酒、5 毫升生抽和 6 克淀粉抓匀，腌制 10 分钟。
    uses: [pork, cooking-wine, soy-sauce, starch]
  - text: 将剩余的生抽、香醋、白糖、4 克淀粉和清水混合，调成鱼香汁。
    uses: [soy-sauce, vinegar, sugar, starch, water]
  - text: 热锅加入约三分之二的食用油，倒入肉丝快速滑炒至熟透，盛出备用。
    uses: [oil, pork]
  - text: 加入剩余的油，炒香姜蒜末和泡红椒，再放入胡萝卜、木耳、笋丝和青椒，翻炒至熟。
    uses: [oil, ginger, garlic, pickled-chili, carrot, wood-ear, bamboo-shoot, green-pepper]
  - text: 倒回肉丝，将鱼香汁搅匀后倒入锅中，大火翻炒至汤汁浓稠，撒葱花出锅。
    uses: [pork, soy-sauce, vinegar, sugar, starch, water, scallion]

